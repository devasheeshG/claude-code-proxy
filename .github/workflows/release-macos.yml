name: Release Claude Code Proxy macOS app

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 0.1.0)
        required: true
        default: 0.1.0
  push:
    tags:
      - "macos-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Claude Code Proxy macOS app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clients/claude-menu-bar
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#macos-v}"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=macos-v$version" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: swift build --configuration release

      - name: Assemble and sign application bundle
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          app="$RUNNER_TEMP/Claude Code Proxy.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp .build/release/ClaudeMenuBar "$app/Contents/MacOS/ClaudeMenuBar"
          cp Resources/Info.plist "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$app/Contents/Info.plist"
          chmod +x "$app/Contents/MacOS/ClaudeMenuBar"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          hdiutil create -volname "Claude Code Proxy" -srcfolder "$app" -ov -format UDZO "$GITHUB_WORKSPACE/artifacts/Claude-Code-Proxy-macOS.dmg" >/dev/null

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Claude Code Proxy macOS ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          files: |
            artifacts/Claude-Code-Proxy-macOS.dmg
